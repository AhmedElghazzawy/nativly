# Render Blueprint: https://render.com/docs/blueprint-spec
# Free plan (no card). The database is Neon (free tier); its URL is entered once in the
# Render dashboard and never committed.
services:
  - type: web
    name: nativly-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Deploy only after GitHub CI has passed on main.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - api/**
        - content/**
    envVars:
      - key: NATIVLY_ENVIRONMENT
        value: production
      - key: NATIVLY_DATABASE_URL
        sync: false # paste Neon's direct (non-pooled) connection string when prompted
      - key: NATIVLY_JWT_SECRET_KEY
        generateValue: true # 256-bit random value created by Render

  - type: web
    name: nativly-web
    runtime: node
    plan: free
    region: frankfurt
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: API_URL
        value: https://nativly-api.onrender.com
