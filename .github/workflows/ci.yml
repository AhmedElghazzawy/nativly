name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests

  test:
    name: Tests & migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nativly
          POSTGRES_PASSWORD: nativly
          POSTGRES_DB: nativly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nativly"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NATIVLY_DATABASE_URL: postgresql+asyncpg://nativly:nativly@localhost:5432/nativly
      NATIVLY_TEST_DATABASE_URL: postgresql+asyncpg://nativly:nativly@localhost:5432/nativly_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Tests
        run: uv run pytest --cov --cov-report=term
      # Runs against the throwaway CI database only.
      - name: Migrations apply, match the models, and reverse cleanly
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
