name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests

  test:
    name: Tests & migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nativly
          POSTGRES_PASSWORD: nativly
          POSTGRES_DB: nativly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nativly"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NATIVLY_DATABASE_URL: postgresql+asyncpg://nativly:nativly@localhost:5432/nativly
      NATIVLY_TEST_DATABASE_URL: postgresql+asyncpg://nativly:nativly@localhost:5432/nativly_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Tests
        run: uv run pytest --cov --cov-report=term
      # Runs against the throwaway CI database only.
      - name: Migrations apply, match the models, and reverse cleanly
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web:
    name: Web lint, types, unit tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (API + web + Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nativly
          POSTGRES_PASSWORD: nativly
          POSTGRES_DB: nativly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nativly"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NATIVLY_DATABASE_URL: postgresql+asyncpg://nativly:nativly@localhost:5432/nativly
      NATIVLY_AI_PROVIDER: fake  # deterministic demo answers; no API key in CI
      API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start API with migrations and content
        working-directory: api
        run: |
          uv sync --locked
          uv run alembic upgrade head
          uv run python -m app.learning.importer ../content
          uv run fastapi run app/main.py --port 8000 > ../api.log 2>&1 &
      - name: Generated API types match the API
        working-directory: web
        run: |
          npm ci
          npm run gen:api
          git diff --exit-code -- openapi.json src/lib/api-schema.d.ts
      - name: Build and start web
        working-directory: web
        run: |
          npm run build
          npm start > ../web.log 2>&1 &
          npx --yes wait-on@9 --timeout 60000 http://localhost:8000/health/ready http://localhost:3000
      - name: Playwright
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload traces and logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-debug
          path: |
            web/test-results
            api.log
            web.log
