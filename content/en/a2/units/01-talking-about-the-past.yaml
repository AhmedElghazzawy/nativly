slug: en-a2-u01
position: 1
title: Talking about the past
description: Tell someone what you did yesterday, last weekend or a year ago.

lessons:
  - slug: en-a2-u01-l01-what-did-you-do
    title: What I did yesterday
    summary: Regular past simple verbs and words for "when".
    estimated_minutes: 15
    objectives:
      - en-a2-past-simple-regular
      - en-a2-past-time-expressions
    steps:
      - kind: explain
        title: Finished actions in the past
        body: |
          We use the **past simple** for actions that started and finished in the past.

          For most verbs, add **-ed**. The form is the same for *I, you, he, she, we, they*:

          | Verb | Past simple |
          |---|---|
          | work | work**ed** |
          | watch | watch**ed** |
          | live | live**d** *(verb ends in -e: add only -d)* |
          | study | stud**ied** *(consonant + y → -ied)* |
          | stop | stop**ped** *(short verb, consonant-vowel-consonant: double the last letter)* |

          > I **worked** late yesterday. She **studied** for her exam last night.

      - kind: exercise
        exercise:
          slug: en-a2-u01-l01-ex01
          objective: en-a2-past-simple-regular
          type: mcq
          difficulty: 1
          prompt: "Choose the correct past form: Yesterday I ___ my grandmother."
          options: [visit, visited, visitted, visiting]
          answer: 1
          explanation: >-
            "Visit" is a regular verb, so the past simple is visit + -ed = "visited".
            We don't double the t because the stress is on the first syllable (VIS-it).

      - kind: exercise
        exercise:
          slug: en-a2-u01-l01-ex02
          objective: en-a2-past-simple-regular
          type: cloze
          difficulty: 2
          prompt: Write the past simple of the verbs in brackets.
          text: "Last summer we ___ (live) in Lisbon, and my sister ___ (study) English every day."
          answers:
            - [lived]
            - [studied]
          explanation: >-
            "Live" ends in -e, so add only -d: lived. "Study" ends in consonant + y,
            so change y to i and add -ed: studied.

      - kind: explain
        title: Saying when
        body: |
          Past time expressions usually go at the **end** (or the start) of the sentence:

          - **yesterday**, yesterday morning, yesterday evening
          - **last** night / week / month / year / Monday
          - two days **ago**, a week **ago**, ten years **ago**
          - **in** 2019, **in** May

          > I called him **two days ago**. **Last year** we moved to Toronto.

          Careful: we say *last night*, not ~~yesterday night~~, and *last week*, not ~~the last week~~.

      - kind: exercise
        exercise:
          slug: en-a2-u01-l01-ex03
          objective: en-a2-past-time-expressions
          type: mcq
          difficulty: 1
          prompt: "Which sentence is correct?"
          options:
            - I watched a film yesterday night.
            - I watched a film last night.
            - I watched a film the last night.
            - I watched a film night ago.
          answer: 1
          explanation: >-
            For the evening before today we say "last night". "Yesterday night" is a very
            common mistake, and "ago" always needs an amount of time before it (two nights ago).

      - kind: exercise
        exercise:
          slug: en-a2-u01-l01-ex04
          objective: en-a2-past-time-expressions
          type: cloze
          difficulty: 2
          prompt: Complete with one word.
          text: "We started this course three weeks ___, and I finished the first unit ___ Monday."
          answers:
            - [ago]
            - [last, "on"]
          explanation: >-
            "Three weeks ago" counts back from now. For a day we can say "last Monday"
            or "on Monday".

      - kind: exercise
        exercise:
          slug: en-a2-u01-l01-ex05
          objective: en-a2-past-simple-regular
          type: reorder
          difficulty: 2
          prompt: Put the words in order to make a sentence.
          answer: [She, played, tennis, with, her, friends, last, weekend]
          explanation: >-
            English word order is subject (She) + verb (played) + object (tennis) + extra
            information (with her friends) + time (last weekend).

  - slug: en-a2-u01-l02-where-did-you-go
    title: Where did you go?
    summary: Common irregular verbs, and questions and negatives with "did".
    estimated_minutes: 20
    objectives:
      - en-a2-past-simple-irregular
      - en-a2-past-simple-questions
    steps:
      - kind: explain
        title: Irregular verbs
        body: |
          Many of the most common verbs are **irregular**: they don't take -ed.
          You need to learn them, but there aren't many you use every day.

          | Verb | Past simple | | Verb | Past simple |
          |---|---|---|---|---|
          | go | **went** | | see | **saw** |
          | have | **had** | | make | **made** |
          | get | **got** | | eat | **ate** |
          | do | **did** | | buy | **bought** |

          > We **went** to the beach and **had** lunch by the sea.

      - kind: exercise
        exercise:
          slug: en-a2-u01-l02-ex01
          objective: en-a2-past-simple-irregular
          type: mcq
          difficulty: 1
          prompt: "Last weekend we ___ to my uncle's house."
          options: [goed, went, gone, go]
          answer: 1
          explanation: >-
            "Go" is irregular: the past simple is "went". "Gone" is the past participle,
            used with have (I have gone), not on its own.

      - kind: exercise
        exercise:
          slug: en-a2-u01-l02-ex02
          objective: en-a2-past-simple-irregular
          type: cloze
          difficulty: 2
          prompt: Write the past simple of the verbs in brackets.
          text: "I ___ (buy) a new phone, but I ___ (see) a cheaper one the next day!"
          answers:
            - [bought]
            - [saw]
          explanation: >-
            Both are irregular: buy → bought, see → saw. Watch the spelling of "bought"
            (b-o-u-g-h-t).

      - kind: explain
        title: Questions and negatives with did
        body: |
          For questions and negatives, use **did** / **didn't** + the **base form** of the verb.
          The past is already in *did*, so the main verb doesn't change:

          | | |
          |---|---|
          | Question | **Did** you **go** out last night? |
          | Short answers | Yes, I **did**. / No, I **didn't**. |
          | Negative | I **didn't go** out. *(not ~~didn't went~~)* |
          | Wh- question | Where **did** you **go**? What **did** she **buy**? |

      - kind: exercise
        exercise:
          slug: en-a2-u01-l02-ex03
          objective: en-a2-past-simple-questions
          type: mcq
          difficulty: 2
          prompt: "Which sentence is correct?"
          options:
            - Did you saw the match?
            - Did you see the match?
            - You did see the match?
            - Saw you the match?
          answer: 1
          explanation: >-
            After "did" we always use the base form: "Did you see…?". "Did you saw" puts
            the past tense in two places, which English doesn't do.

      - kind: exercise
        exercise:
          slug: en-a2-u01-l02-ex04
          objective: en-a2-past-simple-questions
          type: cloze
          difficulty: 3
          prompt: Make the sentence negative.
          text: "We went to the cinema. → We ___ ___ to the cinema."
          answers:
            - [didn't, did not]
            - [go]
          explanation: >-
            Negative past simple = didn't (did not) + base form. "Went" becomes "go"
            because "didn't" already shows the past.

      - kind: exercise
        exercise:
          slug: en-a2-u01-l02-ex05
          objective: en-a2-past-simple-questions
          type: reorder
          difficulty: 3
          prompt: Put the words in order to make a question.
          answer: [Where, did, you, have, dinner, yesterday, "?"]
          explanation: >-
            Wh- question word order: question word (Where) + did + subject (you) +
            base verb (have) + the rest (dinner yesterday).

  - slug: en-a2-u01-l03-how-was-it
    title: How was your weekend?
    summary: The past of "be" — was and were — for places, feelings and opinions.
    estimated_minutes: 15
    objectives:
      - en-a2-past-be
    steps:
      - kind: explain
        title: Was or were?
        body: |
          The verb **be** has two past forms. Choose by the subject:

          | Subject | Past of be |
          |---|---|
          | I, he, she, it | **was** |
          | you, we, they | **were** |

          > The film **was** great. We **were** very tired after the trip.

          Use was/were for states, places and feelings in the past — not *did*:
          *I was at home* (not ~~I did be at home~~).

      - kind: exercise
        exercise:
          slug: en-a2-u01-l03-ex01
          objective: en-a2-past-be
          type: mcq
          difficulty: 1
          prompt: "The weather ___ beautiful on Saturday."
          options: [were, was, did, is]
          answer: 1
          explanation: >-
            "The weather" is singular (it), so the past of be is "was". "Were" is for
            you, we and they.

      - kind: exercise
        exercise:
          slug: en-a2-u01-l03-ex02
          objective: en-a2-past-be
          type: cloze
          difficulty: 2
          prompt: Complete with was or were.
          text: "My parents ___ in Rome last week, and the hotel ___ really nice."
          answers:
            - ["were"]
            - ["was"]
          explanation: >-
            "My parents" = they → were. "The hotel" = it → was.

      - kind: explain
        title: Questions and negatives
        body: |
          With **was/were** you don't need *did*. Swap the order for questions,
          and add **n't** for negatives:

          | | |
          |---|---|
          | Question | **Was** it expensive? **Were** you at work? |
          | Short answers | Yes, it **was**. / No, we **weren't**. |
          | Negative | It **wasn't** cold. They **weren't** there. |
          | Wh- question | How **was** your weekend? Where **were** you? |

      - kind: exercise
        exercise:
          slug: en-a2-u01-l03-ex03
          objective: en-a2-past-be
          type: mcq
          difficulty: 2
          prompt: "Which question is correct?"
          options:
            - Did you be at home yesterday?
            - Were you at home yesterday?
            - Was you at home yesterday?
            - You were at home yesterday?
          answer: 1
          explanation: >-
            Questions with be don't use "did": just put "were" before the subject.
            "You" always takes "were", even for one person.

      - kind: exercise
        exercise:
          slug: en-a2-u01-l03-ex04
          objective: en-a2-past-be
          type: cloze
          difficulty: 3
          prompt: Make the sentence negative. Use a short form.
          text: "The museum was open. → The museum ___ open."
          answers:
            - ["wasn't", "was not"]
          explanation: >-
            Negative of was = wasn't (was not). No "did" with the verb be.

      - kind: exercise
        exercise:
          slug: en-a2-u01-l03-ex05
          objective: en-a2-past-be
          type: reorder
          difficulty: 2
          prompt: Put the words in order to make a question.
          answer: [How, was, your, holiday, in, Greece, "?"]
          explanation: >-
            Wh- question with be: question word (How) + was + subject (your holiday) +
            the rest (in Greece).

  - slug: en-a2-u01-l04-tell-a-story
    title: Tell me what happened
    summary: Put events in order with first, then, after that and finally.
    estimated_minutes: 20
    objectives:
      - en-a2-narrative-sequence
      - en-a2-past-simple-irregular
    steps:
      - kind: explain
        title: Telling a story in order
        body: |
          When you tell a story, **sequencing words** help the listener follow:

          1. **First,** … — the first thing that happened
          2. **Then,** … / **After that,** … — the next things
          3. **Finally,** … — the last thing

          > **First,** we took a taxi to the station. **Then** we had coffee.
          > **After that,** we got on the train. **Finally,** we arrived in Paris at midnight.

          Put a comma after *First*, *After that* and *Finally* at the start of a sentence.
          *Then* usually doesn't need one.

      - kind: exercise
        exercise:
          slug: en-a2-u01-l04-ex01
          objective: en-a2-narrative-sequence
          type: mcq
          difficulty: 1
          prompt: "Which word starts the LAST part of a story?"
          options: [First, Then, After that, Finally]
          answer: 3
          explanation: >-
            "Finally" introduces the last event. "First" starts the story, and "then" /
            "after that" connect the middle events.

      - kind: exercise
        exercise:
          slug: en-a2-u01-l04-ex02
          objective: en-a2-past-simple-irregular
          type: cloze
          difficulty: 2
          prompt: Complete the story with the past simple of the verbs in brackets.
          text: "First, I ___ (get) up at seven. Then I ___ (have) breakfast and ___ (leave) the house."
          answers:
            - ["got"]
            - ["had"]
            - ["left"]
          explanation: >-
            All three are irregular: get → got, have → had, leave → left.

      - kind: exercise
        exercise:
          slug: en-a2-u01-l04-ex03
          objective: en-a2-narrative-sequence
          type: reorder
          difficulty: 2
          prompt: Put the words in order.
          answer: [After, that, ",", we, went, to, the, beach, "."]
          explanation: >-
            The sequencing phrase comes first, followed by a comma, then subject + verb +
            the rest of the sentence.

      - kind: explain
        title: Linking two actions in one sentence
        body: |
          You can join two short actions with **and then** or **and**:

          > I finished work **and then** I went to the gym.
          > She bought a ticket **and** got on the bus.

          When the subject is the same, you don't need to repeat it after *and*:
          *She bought a ticket and (she) got on the bus.*

      - kind: exercise
        exercise:
          slug: en-a2-u01-l04-ex04
          objective: en-a2-narrative-sequence
          type: mcq
          difficulty: 2
          prompt: "Choose the best next sentence: \"First, we had dinner at a small restaurant.\""
          options:
            - Finally, we decided to go out.
            - After that, we walked along the river.
            - First, we were hungry.
            - Then, we will go home.
          answer: 1
          explanation: >-
            The story is in the past and we need the next event: "After that, we walked…".
            "Finally" would end the story too early, and "will go" is the future.

      - kind: exercise
        exercise:
          slug: en-a2-u01-l04-ex05
          objective: en-a2-past-simple-irregular
          type: cloze
          difficulty: 3
          prompt: Complete with the past simple.
          text: "Finally, we ___ (come) home and I ___ (sleep) for ten hours!"
          answers:
            - ["came"]
            - ["slept"]
          explanation: >-
            come → came, sleep → slept. Both are irregular, so they don't take -ed.
